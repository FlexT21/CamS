sonar.organization=flext21
sonar.projectKey=FlexT21_CamS

sonar.sources=apps/server/src/portal,apps/web/src
sonar.tests=apps/server/src/portal/tests,apps/web/tests

sonar.test.inclusions=**/test_*.py,**/tests/**/*.py,**/*.test.mjs
sonar.coverage.exclusions=apps/web/src/**/*.tsx,apps/web/src/main.tsx
sonar.exclusions=**/*.sql

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=coverage/web-lcov.info
